spring:
  application.name: commerce-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      connection-init-sql: SET search_path TO commerce
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
  flyway:
    enabled: true
    table: commerce_flyway_schema_history
    schemas: commerce
    default-schema: commerce
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  security.oauth2.resourceserver.jwt.issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/platform}
  security.oauth2.resourceserver.jwt.jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/platform}/protocol/openid-connect/certs}
server.port: ${COMMERCE_SERVICE_PORT:8085}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
