spring:
  application.name: identity-service
  security.oauth2.resourceserver.jwt.issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/platform}
  security.oauth2.resourceserver.jwt.jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/platform}/protocol/openid-connect/certs}
server.port: ${IDENTITY_SERVICE_PORT:8097}
identity.keycloak.token-url: ${KEYCLOAK_TOKEN_URL:http://localhost:8080/realms/platform/protocol/openid-connect/token}
identity.keycloak.client-id: ${KEYCLOAK_CLIENT_ID:platform-backend}
identity.keycloak.client-secret: ${KEYCLOAK_CLIENT_SECRET:}
management:
  endpoints.web.exposure.include: ${MANAGEMENT_ENDPOINTS:health,info,metrics}
  endpoint.health.probes.enabled: true
