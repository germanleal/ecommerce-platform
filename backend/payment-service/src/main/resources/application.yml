spring:
  application:
    name: payment-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
  flyway:
    enabled: true
    table: payment_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/platform}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/platform}/protocol/openid-connect/certs}
server:
  port: ${PAYMENT_SERVICE_PORT:8091}
payment:
  provider: ${PAYMENT_PROVIDER:fake}
  timeout: ${PAYMENT_PROVIDER_TIMEOUT:5s}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
